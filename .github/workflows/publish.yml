name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag, package version, and changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version"
            exit 1
          fi
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1 }
            found && $0 ~ "^## \\[" && !($0 ~ "^## \\[" ver "\\]") { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $version"
            exit 1
          fi

      - run: npm ci
      - run: npm test

      - name: Package
        run: npx --yes --package=@vscode/vsce@4.1.1 vsce package --no-dependencies -o extension.vsix

      - name: Publish to Visual Studio Marketplace
        run: npx --yes --package=@vscode/vsce@4.1.1 vsce publish --packagePath extension.vsix --oidc --skip-duplicate

      - name: Publish to Open VSX
        run: npx --yes ovsx publish extension.vsix --trusted-publishing --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" extension.vsix --title "$GITHUB_REF_NAME" --notes-file release-notes.md
